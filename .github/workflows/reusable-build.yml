name: Reusable Build

on:
  workflow_call:
    inputs:
      php-version:
        required: true
        type: string
      artifact-name:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          composer-options: '--no-dev --optimize-autoloader'

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build plugin for release
        run: npm run build:prod

      - name: Verify compiled assets and production dependencies
        run: |
          set -euo pipefail

          required_files=(
            "build/admin.css"
            "build/admin-rtl.css"
            "build/onboarding.css"
            "build/onboarding-rtl.css"
            "build/onboarding.js"
            "build/onboarding.asset.php"
            "build/search.js"
            "build/search.asset.php"
            "build/settings.js"
            "build/settings.asset.php"
            "vendor/autoload.php"
            "vendor-prefixed/autoload.php"
          )

          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty required file: $file"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::Release build is incomplete. Aborting before packaging."
            exit 1
          fi

          echo "All required build/ and vendor(-prefixed)/ files are present."

      - name: Start the Docker testing environment
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm run wp-env start

      - name: Generate Translation files
        run: npm run i18n:make-pot

      - name: Create plugin zip
        run: npm run plugin-zip

      - name: Verify plugin zip contents
        run: |
          set -euo pipefail

          required_paths=(
            "onesearch/build/admin.css"
            "onesearch/build/admin-rtl.css"
            "onesearch/build/onboarding.css"
            "onesearch/build/onboarding-rtl.css"
            "onesearch/build/onboarding.js"
            "onesearch/build/onboarding.asset.php"
            "onesearch/build/search.js"
            "onesearch/build/search.asset.php"
            "onesearch/build/settings.js"
            "onesearch/build/settings.asset.php"
            "onesearch/vendor/autoload.php"
            "onesearch/vendor-prefixed/autoload.php"
            "onesearch/onesearch.php"
          )

          listing="$(unzip -Z1 onesearch.zip)"

          missing=0
          for path in "${required_paths[@]}"; do
            if ! grep -qFx "$path" <<< "$listing"; then
              echo "::error::onesearch.zip is missing required path: $path"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::onesearch.zip failed validation. Refusing to publish this artifact."
            exit 1
          fi

          echo "onesearch.zip contains all required release paths."

      - name: Upload plugin zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: onesearch.zip
          if-no-files-found: error
