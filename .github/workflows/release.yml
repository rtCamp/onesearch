name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Prepare release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    permissions:
      contents: read
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: rtCamp/plugin-skeleton-d/.github/workflows/reusable-build-public.yml@8b0eea6f9316f715a6a55f5269d77ff2c8dd2690 # dev-main
    with:
      php-version: '8.3'
      plugin-slug: onesearch
      artifact-name: onesearch

  upload:
    name: Upload release asset
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onesearch
          path: .

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} onesearch.zip --clobber
