name: PR Cleanup

# `pull_request_target` gives fork PRs a token that can delete artifacts. Never check out or run PR code here.
on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    name: PR Cleanup
    uses: rtCamp/plugin-skeleton-d/.github/workflows/reusable-pr-cleanup-public.yml@8b0eea6f9316f715a6a55f5269d77ff2c8dd2690 # dev-main
    permissions:
      actions: write
      contents: write
    with:
      pr-number: ${{ github.event.pull_request.number }}
      head-ref: ${{ github.event.pull_request.head.ref }}
      head-repo-id: ${{ github.event.pull_request.head.repo.id }}
