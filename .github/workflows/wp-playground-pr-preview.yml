name: WordPress Playground PR Preview

# `workflow_run` workflows always run from the default branch, so changes here only take effect once merged.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions: {}

jobs:
  playground-preview:
    name: Playground Preview
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    uses: rtCamp/plugin-skeleton-d/.github/workflows/reusable-wp-playground-pr-preview-public.yml@8b0eea6f9316f715a6a55f5269d77ff2c8dd2690 # dev-main
    permissions:
      contents: write
      pull-requests: write
    with:
      plugin-slug: onesearch
